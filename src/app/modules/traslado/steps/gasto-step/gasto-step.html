<header class="step-head">
  <span class="step-eyebrow"><span class="paso">Paso 6 de 8</span> Insumos</span>
  <h2 class="step-title">Registro de gasto</h2>
  <p class="step-sub">Relaciona los insumos y servicios utilizados durante el traslado.</p>
</header>

<div
  *ngFor="let fila of filas; let i = index"
  [formGroup]="fila"
  class="card gasto-card">
  <div class="card__body">

    <div class="card-header">
      <span>Registro {{ i + 1 }}</span>
      <button
        type="button"
        class="btn btn--ghost btn--sm icon-only"
        (click)="eliminar(i)"
        [disabled]="gastos.length === 1"
        aria-label="Eliminar gasto">
        <app-icon name="trash" [size]="18"></app-icon>
      </button>
    </div>

    <div class="gasto-grid">
      <div class="field desc">
        <label>Descripción <span class="required" *ngIf="fila.get('descripcion') | esObligatorio">*</span></label>
        <input class="field-input" formControlName="descripcion">
        <span class="field-error" *ngIf="fila.get('descripcion')?.hasError('required') && fila.get('descripcion')?.touched">
          La descripción es requerida
        </span>
        <span class="field-error" *ngIf="fila.get('descripcion')?.hasError('minlength') && fila.get('descripcion')?.touched">
          La descripción debe tener al menos 3 caracteres
        </span>
      </div>

      <div class="field cant">
        <label>Cantidad <span class="required" *ngIf="fila.get('cantidad') | esObligatorio">*</span></label>
        <input class="field-input" type="number" formControlName="cantidad">
        <span class="field-error" *ngIf="fila.get('cantidad')?.hasError('required') && fila.get('cantidad')?.touched">
          La cantidad es requerida
        </span>
        <span class="field-error" *ngIf="fila.get('cantidad')?.hasError('min') && fila.get('cantidad')?.touched">
          La cantidad debe ser mayor a 0
        </span>
      </div>
    </div>

  </div>
</div>

<button type="button" class="btn btn--outline add-btn" (click)="agregar()">
  <app-icon name="plus" [size]="18"></app-icon>
  Agregar gasto
</button>
