<header class="step-head">
  <span class="step-eyebrow"><span class="paso">Paso 3 de 8</span> Historia clínica</span>
  <h2 class="step-title">Antecedentes</h2>
  <p class="step-sub">Marca los antecedentes relevantes y registra el diagnóstico principal.</p>
</header>

<div [formGroup]="group" class="card card--accent">
  <div class="card__body">

    <div class="checkbox-grid">
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="acv">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">ACV</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="alergia">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Alergia</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="artritis">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Artritis</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="asma">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Asma</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="cancer">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Cáncer</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="cardiacos">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Cardíacos</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="dislipidemia">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Dislipidemia</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="epoc">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">EPOC</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="fallaRenal">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Falla renal</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="diabetes">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Diabetes</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="ginecoObstetricos">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Gineco-obstétricos</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="hipertension">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Hipertensión</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="quirurgicos">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Quirúrgicos</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="psiquiatricos">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Psiquiátricos</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="otros">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Otros</span>
      </label>
    </div>

    <div class="field full-width">
      <label>DX #1 (Diagnóstico principal) <span class="required" *ngIf="group.get('dxPrincipal') | esObligatorio">*</span></label>
      <textarea class="field-input" rows="3" formControlName="dxPrincipal"></textarea>
      <span class="field-error" *ngIf="group.get('dxPrincipal')?.invalid && group.get('dxPrincipal')?.touched">
        El diagnóstico principal es requerido
      </span>
    </div>

  </div>
</div>
