<header class="step-head">
  <span class="step-eyebrow"><span class="paso">Paso 5 de 8</span> Valoración</span>
  <h2 class="step-title">Examen físico</h2>
  <p class="step-sub">Marca los sistemas evaluados y describe los hallazgos clínicos.</p>
</header>

<div [formGroup]="group" class="card card--accent">
  <div class="card__body">

    <!-- Checklist -->
    <div class="sistemas-grid">
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="cabeza">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Cabeza</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="ojos">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Ojos</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="orl">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">ORL</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="cuello">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Cuello</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="cardiovascular">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Cardiovascular</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="pulmonar">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Pulmonar</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="abdomen">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Abdomen</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="gastrointestinal">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Gastrointestinal</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="genitourinario">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Genitourinario</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="extremidades">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Extremidades</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="neurologico">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Neurológico</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" class="checkbox-input" formControlName="psiquiatrico">
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Psiquiátrico</span>
      </label>
    </div>

    <!-- Descripción -->
    <div class="field full-width">
      <label>Descripción del examen físico <span class="required" *ngIf="group.get('descripcion') | esObligatorio">*</span></label>
      <textarea class="field-input" rows="6" placeholder="Descripción clínica del examen físico" formControlName="descripcion"></textarea>
      <span class="field-error" *ngIf="group.get('descripcion')?.invalid && group.get('descripcion')?.touched">
        La descripción del examen físico es requerida
      </span>
    </div>

  </div>
</div>
